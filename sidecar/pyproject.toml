[project]
name = "zk-sidecar"
version = "0.1.1"
description = "Local service for the Zettelkasten Obsidian plugin: ingest, GraphRAG and code kernels."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Andrew R. Kane", email = "dev@andrewrkane.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyyaml>=6.0",
    "openai>=2.0",
    "pymupdf>=1.28",
    "rapidocr-onnxruntime>=1.4",
    "trafilatura>=2.3",
    "markitdown[docx,xlsx,pptx]>=0.1.8",
    "jupyter_client>=8.6",
    "textblob>=0.19",
    "graspologic-native>=1.2",
]

[project.optional-dependencies]
# Typed key ideas for communities. Pulls in PyTorch, several GB.
entities = ["gliner>=0.2.21"]
dev = ["pytest>=8", "httpx2>=2.14", "ipykernel>=6.29", "matplotlib>=3.9"]

[project.scripts]
zk-sidecar = "zk_sidecar.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
