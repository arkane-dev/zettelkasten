[project]
name = "zk-sidecar"
version = "0.1.0"
description = "Local service for the Zettelkasten Obsidian plugin: ingest, GraphRAG and code kernels."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Andrew R. Kane", email = "dev@andrewrkane.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.14"]

[project.scripts]
zk-sidecar = "zk_sidecar.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
